<!DOCTYPE html>
<!-- Declara que este documento usa HTML5 -->

<html lang="pt-BR">
<!-- Elemento raizda página. lang="pt-BR" defu=ine idioma -->

<head>

    <!-- informações dos bastidores: não aparecem diretamente na tela -->

    <meta charset="UTF-8">  
    <!-- Codificação de caracteres, garante acentos corretos -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ativa a responsividade em dispositivos móveis -->

    <title>Escola Digital Livre</title>
    <!-- Titulo da pagina na web -->

    <link rel="stylesheet" href="style.css">
    <!-- Serve para "linkar" ou ligar o documento css no documento html -->

</head>
<body>
    <!-- tudo que o usuário vê e interage fica aqui -->
    
    <header class="header">
        <!-- Tag semântica: que indica o cabeçalho da página -->

        <div class="header-container">
        <!-- Container que agrupa e centraliza o conteúdo do header -->

            <a href="#">

                <!-- Logo clicável, leva para a home -->

                <img src="./assets/logo.png" alt="Logo do projeto Escola Digital Livre" width="60px">
                <!-- img: adiciona imagem / src: caminho da imagem / alt: legenda da imagem -->

                <span></span>

            </a>
                
        </div>

    </header>
</body>
</html>
